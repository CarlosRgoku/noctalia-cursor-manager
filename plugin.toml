id = "my-tools/cursor-manager"
name = "Cursor Manager"
version = "1.1.0"
plugin_api = 24
author = "my-tools"
license = "MIT"
icon = "mouse"
description = "Applies a cursor theme and size at startup and on demand (niri, Hyprland, Sway and GTK)."
tags = ["cursor", "theme", "accessibility", "mouse", "macos"]

[[setting]]
key = "theme"
type = "string"
label_key = "settings.theme.label"
description_key = "settings.theme.description"
default = "macOS"

[[setting]]
key = "size"
type = "int"
label_key = "settings.size.label"
description_key = "settings.size.description"
default = 48
min = 16
max = 128

[[service]]
id = "service"
entry = "service.luau"
