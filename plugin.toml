id = "my-tools/cursor-manager"
name = "Cursor Manager"
version = "1.0.0"
plugin_api = 24
author = "my-tools"
license = "MIT"
icon = "mouse"
description = "Applies a larger mouse cursor at startup and on demand (niri, Hyprland, Sway and GTK)."
tags = ["cursor", "accessibility", "mouse"]

[[setting]]
key = "size"
type = "int"
label_key = "settings.size.label"
description_key = "settings.size.description"
default = 48
min = 16
max = 128

[[service]]
id = "service"
entry = "service.luau"
